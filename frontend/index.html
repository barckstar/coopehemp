    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Qué es CoopeHemp R.L.?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CoopeHemp R.L. es la primera cooperativa costarricense dedicada a la producción sostenible y regulada de cáñamo (hemp). Conectamos productores, transformadores y consumidores con productos naturales y certificados."
          }
        },
        {
          "@type": "Question",
          "name": "¿Dónde está ubicada CoopeHemp?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CoopeHemp R.L. opera en Costa Rica, trabajando con más de 50 productores a nivel nacional para ofrecer productos de cáñamo 100% orgánicos."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué productos ofrece CoopeHemp?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CoopeHemp ofrece aceites de CBD de espectro completo, pre-rolls de cáñamo, té de cáñamo, bálsamos terapéuticos, proteína de cáñamo, fibra textil y más productos naturales derivados del cáñamo."
          }
        },
        {
          "@type": "Question",
          "name": "¿Los productos de CoopeHemp son legales en Costa Rica?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. CoopeHemp R.L. opera bajo el marco legal costarricense vigente para la producción y comercialización de cáñamo industrial y sus derivados, con productos certificados y regulados."
          }
        }
      ]
    }
